<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP System</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="#1abc9c"/>
                        <path d="M14 16h20v4H14v-4zm0 8h20v4H14v-4zm0 8h20v4H14v-4z" fill="white" opacity="0.9"/>
                        <rect x="10" y="12" width="28" height="2" rx="1" fill="white" opacity="0.6"/>
                        <rect x="10" y="20" width="28" height="2" rx="1" fill="white" opacity="0.6"/>
                        <rect x="10" y="28" width="28" height="2" rx="1" fill="white" opacity="0.6"/>
                    </svg>
                </div>
                <h1>ERP System</h1>
                <p class="login-subtitle">Sign in to your account</p>
            </div>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="alert alert-error">
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter your password" required>
                </div>
                <div class="login-actions">
                    <div class="form-check">
                        <label for="id_remember_me">
                            <input type="checkbox" name="remember_me" id="id_remember_me">
                            <span>Remember me</span>
                        </label>
                    </div>
                    <button type="submit" class="btn-login">Sign In</button>
                </div>
            </form>

            <p class="login-footer">Enterprise Resource Planning System</p>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}?v=3"></script>
</body>
</html>
