{% extends 'base.html' %}
{% block title %}Delete User - ERP System{% endblock %}

{% block content %}
<h2>Delete User</h2>
<p>Are you sure you want to delete user <strong>{{ user.username }}</strong>?</p>
<form method="post" data-confirm="Are you sure you want to delete this user?">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Yes, Delete</button>
    <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
