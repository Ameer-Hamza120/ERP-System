{% extends 'base.html' %}
{% block title %}Delete Role - ERP System{% endblock %}

{% block content %}
<h2>Delete Role</h2>
<p>Are you sure you want to delete role <strong>{{ role.name }}</strong>?</p>
<form method="post" data-confirm="Are you sure you want to delete this role?">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Yes, Delete</button>
    <a href="{% url 'role_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
