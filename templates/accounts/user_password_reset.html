{% extends 'base.html' %}
{% block title %}Reset Password - ERP System{% endblock %}

{% block content %}
<h2>Reset Password for {{ user.username }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Reset Password</button>
    <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
