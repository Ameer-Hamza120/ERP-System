{% extends 'base.html' %}
{% block title %}Delete Item - ERP System{% endblock %}

{% block content %}
<h2>Delete Item</h2>
<p>Are you sure you want to delete item <strong>{{ item.name }}</strong>?</p>
<form method="post" data-confirm="Are you sure you want to delete this item?">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Yes, Delete</button>
    <a href="{% url 'item_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
