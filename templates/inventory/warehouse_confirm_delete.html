{% extends 'base.html' %}
{% block title %}Delete Warehouse - ERP System{% endblock %}

{% block content %}
<h2>Delete Warehouse</h2>
<p>Are you sure you want to delete warehouse <strong>{{ warehouse.name }}</strong>?</p>
<form method="post" data-confirm="Are you sure you want to delete this warehouse?">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Yes, Delete</button>
    <a href="{% url 'warehouse_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
